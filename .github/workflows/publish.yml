name: publish
run-name: "${{ (github.event_name == 'push' && github.ref_name == 'main' && 'release patch (auto)') || format('release {0}', inputs.version || inputs.bump) }}"

on:
  push:
    branches:
      - main
      - ci
      - dev
      - beta
      - snapshot-*
  workflow_dispatch:
    inputs:
      bump:
        description: "Bump major, minor, or patch"
        required: false
        type: choice
        options:
          - major
          - minor
          - patch
      version:
        description: "Override version (optional)"
        required: false
        type: string

concurrency: ${{ github.workflow }}-${{ github.ref }}-${{ inputs.version || inputs.bump }}

permissions:
  id-token: write
  contents: write
  packages: write

jobs:
  version:
    runs-on: ubuntu-latest
    # The release itself pushes a "sync release versions" commit back to main
    # (with [skip ci]); the message check is a second guard against a release
    # loop in case that commit ever reaches main through another path.
    if: >-
      github.repository == 'theopenco/devpass-code' &&
      (github.event_name != 'push' || github.ref_name != 'main' ||
       !contains(github.event.head_commit.message, 'sync release versions'))
    steps:
      - uses: actions/checkout@f43a0e5ff2bd294095638e18286ca9a3d1956744 # v3.6.0
        with:
          fetch-depth: 0

      - uses: ./.github/actions/setup-bun

      - name: Configure git user
        run: |
          git config --global user.name "devpass-code-release"
          git config --global user.email "devpass-code-release@users.noreply.github.com"

      # optional capabilities: jobs below are skipped when their secrets are absent
      - id: capabilities
        env:
          AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
        run: |
          echo "sign_windows=$([[ -n "$AZURE_CLIENT_ID" ]] && echo true || echo false)" >> "$GITHUB_OUTPUT"

      - name: Install OpenCode (changelog generation)
        if: inputs.bump || inputs.version || (github.event_name == 'push' && github.ref_name == 'main')
        run: bun i -g opencode-ai

      - id: version
        run: |
          ./script/version.ts
        env:
          GH_TOKEN: ${{ secrets.RELEASE_TOKEN || github.token }}
          # Merges to main cut a patch release automatically.
          OPENCODE_BUMP: ${{ inputs.bump || (github.event_name == 'push' && github.ref_name == 'main' && 'patch') || '' }}
          OPENCODE_VERSION: ${{ inputs.version }}
          OPENCODE_API_KEY: ${{ secrets.OPENCODE_API_KEY }}
          GH_REPO: ${{ github.repository }}
    outputs:
      version: ${{ steps.version.outputs.version }}
      release: ${{ steps.version.outputs.release }}
      tag: ${{ steps.version.outputs.tag }}
      repo: ${{ steps.version.outputs.repo }}
      sign_windows: ${{ steps.capabilities.outputs.sign_windows }}

  build-cli:
    needs: version
    runs-on: ubuntu-latest
    if: github.repository == 'theopenco/devpass-code'
    steps:
      - uses: actions/checkout@f43a0e5ff2bd294095638e18286ca9a3d1956744 # v3.6.0
        with:
          fetch-tags: true

      - uses: ./.github/actions/setup-bun
        with:
          bun-version: 1.4.2

      - name: Build
        id: build
        run: |
          ./packages/cli/script/build.ts ${{ (github.ref_name == 'beta' && '--sourcemaps') || '' }}
        env:
          BUN_COMPILE_RELEASE: bun-v1.4.2
          OPENCODE_VERSION: ${{ needs.version.outputs.version }}
          OPENCODE_RELEASE: ${{ needs.version.outputs.release }}
          GH_REPO: ${{ needs.version.outputs.repo }}
          GH_TOKEN: ${{ secrets.RELEASE_TOKEN || github.token }}

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: devpass-code-cli
          path: |
            packages/cli/dist/devpass-code-darwin*
            packages/cli/dist/devpass-code-linux*

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: devpass-code-cli-windows
          path: packages/cli/dist/devpass-code-windows*

    outputs:
      version: ${{ needs.version.outputs.version }}

  sign-cli-windows:
    needs:
      - build-cli
      - version
    runs-on: windows-2025
    if: github.repository == 'theopenco/devpass-code' && needs.version.outputs.sign_windows == 'true'
    env:
      AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
      AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
      AZURE_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
      AZURE_TRUSTED_SIGNING_ACCOUNT_NAME: ${{ secrets.AZURE_TRUSTED_SIGNING_ACCOUNT_NAME }}
      AZURE_TRUSTED_SIGNING_CERTIFICATE_PROFILE: ${{ secrets.AZURE_TRUSTED_SIGNING_CERTIFICATE_PROFILE }}
      AZURE_TRUSTED_SIGNING_ENDPOINT: ${{ secrets.AZURE_TRUSTED_SIGNING_ENDPOINT }}
    steps:
      - uses: actions/checkout@f43a0e5ff2bd294095638e18286ca9a3d1956744 # v3.6.0

      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: devpass-code-cli-windows
          path: packages/cli/dist

      - name: Azure login
        uses: azure/login@a457da9ea143d694b1b9c7c869ebb04ebe844ef5 # v2.3.0
        with:
          client-id: ${{ env.AZURE_CLIENT_ID }}
          tenant-id: ${{ env.AZURE_TENANT_ID }}
          subscription-id: ${{ env.AZURE_SUBSCRIPTION_ID }}

      - uses: azure/artifact-signing-action@b443cf8ea4124818d2ea9f043cba29fc3ec47b16 # v1.2.0
        with:
          endpoint: ${{ env.AZURE_TRUSTED_SIGNING_ENDPOINT }}
          signing-account-name: ${{ env.AZURE_TRUSTED_SIGNING_ACCOUNT_NAME }}
          certificate-profile-name: ${{ env.AZURE_TRUSTED_SIGNING_CERTIFICATE_PROFILE }}
          files: |
            ${{ github.workspace }}\packages\cli\dist\devpass-code-windows-arm64\bin\devpass-code.exe
            ${{ github.workspace }}\packages\cli\dist\devpass-code-windows-x64\bin\devpass-code.exe
            ${{ github.workspace }}\packages\cli\dist\devpass-code-windows-x64-baseline\bin\devpass-code.exe
          exclude-environment-credential: true
          exclude-workload-identity-credential: true
          exclude-managed-identity-credential: true
          exclude-shared-token-cache-credential: true
          exclude-visual-studio-credential: true
          exclude-visual-studio-code-credential: true
          exclude-azure-cli-credential: false
          exclude-azure-powershell-credential: true
          exclude-azure-developer-cli-credential: true
          exclude-interactive-browser-credential: true

      - name: Verify Windows CLI signatures
        shell: pwsh
        run: |
          $files = @(
            "${{ github.workspace }}\packages\cli\dist\devpass-code-windows-arm64\bin\devpass-code.exe",
            "${{ github.workspace }}\packages\cli\dist\devpass-code-windows-x64\bin\devpass-code.exe",
            "${{ github.workspace }}\packages\cli\dist\devpass-code-windows-x64-baseline\bin\devpass-code.exe"
          )

          foreach ($file in $files) {
            $sig = Get-AuthenticodeSignature $file
            if ($sig.Status -ne "Valid") {
              throw "Invalid signature for ${file}: $($sig.Status)"
            }
          }

      - name: Repack Windows CLI archives
        working-directory: packages/cli/dist
        shell: pwsh
        run: |
          Compress-Archive -Path "devpass-code-windows-arm64\bin\*" -DestinationPath "devpass-code-windows-arm64.zip" -Force
          Compress-Archive -Path "devpass-code-windows-x64\bin\*" -DestinationPath "devpass-code-windows-x64.zip" -Force
          Compress-Archive -Path "devpass-code-windows-x64-baseline\bin\*" -DestinationPath "devpass-code-windows-x64-baseline.zip" -Force

      - name: Upload signed Windows CLI release assets
        if: needs.version.outputs.release != ''
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.RELEASE_TOKEN || github.token }}
        run: |
          gh release upload "v${{ needs.version.outputs.version }}" `
            "${{ github.workspace }}\packages\cli\dist\devpass-code-windows-arm64.zip" `
            "${{ github.workspace }}\packages\cli\dist\devpass-code-windows-x64.zip" `
            "${{ github.workspace }}\packages\cli\dist\devpass-code-windows-x64-baseline.zip" `
            --clobber `
            --repo "${{ needs.version.outputs.repo }}"

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: devpass-code-cli-signed-windows
          path: |
            packages/cli/dist/devpass-code-windows-arm64
            packages/cli/dist/devpass-code-windows-x64
            packages/cli/dist/devpass-code-windows-x64-baseline

  publish:
    needs:
      - version
      - build-cli
      - sign-cli-windows
    # needs.version check: signing may legitimately skip (secrets absent),
    # but nothing can publish when the version job itself was skipped.
    if: always() && !failure() && !cancelled() && needs.version.result == 'success'
    runs-on: ubuntu-latest
    env:
      AUR_KEY: ${{ secrets.AUR_KEY }}
    steps:
      - uses: actions/checkout@f43a0e5ff2bd294095638e18286ca9a3d1956744 # v3.6.0

      - uses: ./.github/actions/setup-bun

      - name: Login to GitHub Container Registry
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3.7.0
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up QEMU
        uses: docker/setup-qemu-action@c7c53464625b32c7a7e944ae62b3e17d2b600130 # v3.7.0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0

      # No registry-url: it makes setup-node write an .npmrc with
      # //registry.npmjs.org/:_authToken=${NODE_AUTH_TOKEN}, which resolves to an
      # empty credential now that we publish via OIDC and would shadow the
      # trusted-publishing exchange. The default registry is npmjs.org anyway.
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "24"

      # Trusted publishing (OIDC) needs npm >= 11.5.1; Node 24 still bundles 11.3.x.
      # Pinned to 11 rather than latest: npm 12 requires node >= 24.15, so @latest
      # would break the moment setup-node resolves an older 24.x.
      - name: Upgrade npm for trusted publishing
        run: |
          npm install -g npm@11
          npm --version

      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: devpass-code-cli
          path: packages/cli/dist

      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: devpass-code-cli-windows
          path: packages/cli/dist

      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        if: needs.version.outputs.sign_windows == 'true'
        with:
          name: devpass-code-cli-signed-windows
          path: packages/cli/dist

      - name: Configure git user
        run: |
          git config --global user.name "devpass-code-release"
          git config --global user.email "devpass-code-release@users.noreply.github.com"

      - name: Setup SSH for AUR
        if: ${{ env.AUR_KEY != '' }}
        run: |
          sudo apt-get update
          sudo apt-get install -y pacman-package-manager
          mkdir -p ~/.ssh
          echo "${{ secrets.AUR_KEY }}" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa
          ssh-keyscan -H aur.archlinux.org >> ~/.ssh/known_hosts || true

      - run: ./script/publish.ts
        env:
          OPENCODE_VERSION: ${{ needs.version.outputs.version }}
          OPENCODE_RELEASE: ${{ needs.version.outputs.release }}
          AUR_KEY: ${{ secrets.AUR_KEY }}
          GITHUB_TOKEN: ${{ secrets.RELEASE_TOKEN || github.token }}
          GH_REPO: ${{ needs.version.outputs.repo }}
          # npm auth comes from OIDC trusted publishing (permissions.id-token: write
          # above). Every devpass-code* package has a trusted publisher pinned to this
          # repo + publish.yml, so no NPM_TOKEN is involved. To add a new platform
          # package, publish its first version with a token, then register it with
          #   npm trust github <pkg> --repo theopenco/devpass-code --file publish.yml \
          #     --allow-publish --yes
          NPM_CONFIG_PROVENANCE: true
